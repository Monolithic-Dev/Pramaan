# Render Blueprint: the whole stack on free tiers with NO Google Cloud billing account.
# Data lives in Firebase (Spark plan: Firestore + Auth); AI uses the free Gemini API key.
# See docs/FREE_DEPLOYMENT_GUIDE.md. Secrets marked sync:false are entered in the Render dashboard.
services:
  - type: web
    name: pramaan-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @pramaan/api-gateway exec tsx src/index.ts
    healthCheckPath: /healthz
    envVars:
      - { key: NODE_VERSION, value: "20" }
      - { key: FIREBASE_PROJECT_ID, sync: false }
      - { key: FIREBASE_WEB_API_KEY, sync: false }
      - { key: FIREBASE_SERVICE_ACCOUNT_JSON, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: WORKER_URL, sync: false }
      - { key: WORKER_SHARED_SECRET, sync: false }
      # The WhatsApp/SMS webhooks fail closed (503) until this is set to the secret the provider sends.
      - { key: WEBHOOK_SHARED_SECRET, sync: false }
      # The live WhatsApp/SMS simulator on /channels (POST /v1/public/demo/message). Rate-limited; set to false to hide it.
      - { key: DEMO_CHANNEL_SIMULATOR, value: "true" }
      # Lock the API to the web app, e.g. https://pramaan-web.onrender.com (comma-separated). Unset = any origin.
      - { key: CORS_ORIGINS, sync: false }

  - type: web
    name: pramaan-worker
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @pramaan/worker-ai-pipeline exec tsx src/index.ts
    healthCheckPath: /healthz
    envVars:
      - { key: NODE_VERSION, value: "20" }
      - { key: FIREBASE_PROJECT_ID, sync: false }
      - { key: FIREBASE_SERVICE_ACCOUNT_JSON, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: WORKER_SHARED_SECRET, sync: false }

  - type: web
    name: pramaan-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pramaan/web build
    staticPublishPath: apps/web/dist
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
    # Built JS/CSS are content-hashed (safe to cache forever); index.html, the manifest and the service
    # worker are not, and must always be revalidated or a stale index.html can outlive the assets it
    # references after a deploy, 404ing on every chunk (the exact bug this fixes).
    headers:
      - { path: /assets/*, name: Cache-Control, value: "public, max-age=31536000, immutable" }
      - { path: /, name: Cache-Control, value: "no-cache" }
      - { path: /index.html, name: Cache-Control, value: "no-cache" }
      - { path: /sw.js, name: Cache-Control, value: "no-cache" }
      - { path: /manifest.webmanifest, name: Cache-Control, value: "no-cache" }
    envVars:
      # Without this Render defaults to its newest Node image, where `corepack enable` fails
      # (EROFS: read-only file system, unlink '/usr/bin/pnpm'). Match the other two services.
      - { key: NODE_VERSION, value: "20" }
      - { key: VITE_API_BASE_URL, sync: false }
      - { key: VITE_FIREBASE_API_KEY, sync: false }
