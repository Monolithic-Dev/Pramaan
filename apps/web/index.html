    <!-- Tamil/Bengali need explicit font fallbacks — some Android system fonts
         render boxes otherwise (docs/phases/phase-7-frontend.md "Traps"). -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

         System fonts render first, the web fonts swap in when they arrive. -->
